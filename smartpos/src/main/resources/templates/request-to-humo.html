<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Zayavka na humo</title>
    <style>
        body {
            font-size: 16px;
            letter-spacing: 1px;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        p {
            margin-bottom: 10px;
        }

        .bold {
            font-weight: bold;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
        }

        .text-center {
            text-align: center;
        }

        .uppercase {
            text-transform: uppercase;
        }

        .row {
            display: flex;
        }

        .justify-between {
            justify-content: space-between;
        }

        .align-center {
            align-items: center;
        }

        .mt-10 {
            margin-top: 20px;
        }

        .mb-2 {
            margin-bottom: 40px;
        }

        .mt-5 {
            margin-top: 150px;
        }

        .mb-8 {
            margin-bottom: 240px;
        }

        .line {
            border-bottom: 1px solid #000;
            text-align: end;
        }

        .sm-text {
            font-size: 12px;
        }

        .indent-10 {
            text-indent: 10px;
        }
    </style>
</head>
<body class="bold">
<div class="row justify-between">
    <p>
        Исх. №
    </p>
    <p>
        Управляющему филиала «Дархан»
    </p>
</div>
<div class="row justify-between">
    <p>
        От __ __ __г
    </p>
    <p>
        ЧАБ «Трастбанк»
    </p>
</div>
<p class="text-center mt-5 mb-2 uppercase">
    ЗАЯВЛЕНИЕ.
</p>
<div class="line" th:text="${companyName}">
</div>
<div class="sm-text text-center">
    (наименование организации)
</div>
<p>
    ИНН <span th:text="${companyInn}"></span> прошу вас подключить эквайринг
    (терминал) HUMO для онлайн ККМ UZKASSA <span th:text="${model}"></span> серийный номер <span
    th:text="${serialNumber}"></span>.
</p>
<div class="row mt-5">
    <div class="row justify-between" style="width: 30%;">
        <span class="indent-10">
            Директор:
        </span>
        <div class="line" style="width: 100%;" th:text="${directorFullName}"></div>
    </div>
    <div class="line" style="width: 70%; margin-left: 30px;">

    </div>
</div>
<p class="mb-8">
    М.П.
</p>
<div>
    Контактный номер: <span th:text="${phone}"></span>
</div>
</body>
</html>
